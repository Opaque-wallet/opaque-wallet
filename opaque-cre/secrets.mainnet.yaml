# Mainnet's secret ids → the environment variables that hold them.
# Names only: the values live in .env.mainnet (gitignored, from
# `node tools/make-keys.ts mainnet`). Separate ids, so the Vault never hands
# the mainnet workflow testnet's key, or the reverse.
secretsNames:
  INTENT_KEY_SEED_MAINNET:
    - OPAQUE_SEED_HEX
  CREDENTIAL_MAC_MAINNET:
    - OPAQUE_MAC_HEX
